name: "Construct #627 candidate"

on:
  push:
    branches:
      - agent/runenrender-radiance-capture-627

permissions:
  contents: write

jobs:
  construct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/runenrender-radiance-capture-627
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Apply correction
        run: python .github/agent-627-build.py
      - name: Match accepted RunenGPU whole-base-mip API
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("engine/src/plugins/render/deterministic_execution/capture.rs")
          text = path.read_text()
          old_import = "    GpuRetainedResourceContinuity, GpuSubmissionFailureKind, GpuTextureAspect,\n    GpuTextureCopyRegion, GpuTextureFormat, GpuTransferRegion,\n"
          new_import = "    GpuRetainedResourceContinuity, GpuSubmissionFailureKind, GpuTextureCopyRegion,\n    GpuTextureFormat, GpuTransferRegion,\n"
          old_call = "GpuTextureCopyRegion::whole_base_mip(texture, GpuTextureAspect::Color)"
          new_call = "GpuTextureCopyRegion::whole_base_mip(texture)"
          if text.count(old_import) != 1 or text.count(old_call) != 1:
              raise SystemExit("accepted RunenGPU constructor correction did not match exact generated source")
          path.write_text(text.replace(old_import, new_import, 1).replace(old_call, new_call, 1))
          PY
      - name: Update dependency lock
        run: cargo +stable update -p runen-gpu
      - name: Format
        run: cargo +stable fmt --all
      - name: Compile engine tests
        run: cargo +stable check -p engine --tests
      - name: Diff hygiene
        run: git diff --check
      - name: Commit candidate
        run: |
          rm .github/workflows/agent-627-build.yml .github/agent-627-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "render: expose correlated deterministic radiance capture interpretation"
          git push origin HEAD:agent/runenrender-radiance-capture-627
