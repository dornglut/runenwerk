name: "Construct #627 candidate"

on:
  push:
    branches:
      - agent/runenrender-radiance-capture-627

permissions:
  contents: write

jobs:
  construct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/runenrender-radiance-capture-627
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply correction
        run: python .github/agent-627-build.py
      - name: Update dependency lock
        run: cargo update -p runen-gpu
      - name: Format
        run: cargo fmt --all
      - name: Compile engine tests
        run: cargo check -p engine --tests
      - name: Diff hygiene
        run: git diff --check
      - name: Commit candidate
        run: |
          rm .github/workflows/agent-627-build.yml .github/agent-627-build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "render: expose correlated deterministic radiance capture interpretation"
          git push origin HEAD:agent/runenrender-radiance-capture-627
