          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          echo "Expected revision: $EXPECTED_REVISION"
          echo "Actual revision:   $actual_revision"
          test "$actual_revision" = "$EXPECTED_REVISION"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      # The remote GHA compiler cache has an account-level egress quota; required
      # merge-group validation must remain executable without that service.
      - name: Set up Rust compiler cache
        if: github.event_name != 'merge_group'
        uses: "Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba" # v0.0.11
        with:
          version: "v0.18.0"

      - name: Configure Rust compiler cache
        run: |
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" != "merge_group" ]; then
            {
              echo "SCCACHE_GHA_ENABLED=on"
              echo "RUSTC_WRAPPER=sccache"
            } >> "$GITHUB_ENV"
          fi

      - name: Install Mesa Vulkan fallback
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools xvfb xauth libxkbcommon-x11-0
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "Lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=${RUNNER_TEMP}/runenrender-vulkan-xdg" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/runenrender-vulkan-xdg"
          chmod 700 "${RUNNER_TEMP}/runenrender-vulkan-xdg"

      - name: Prove Vulkan software adapter
        run: vulkaninfo --summary

      - name: Prove original and species Boids native without GPU image readback
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_BOIDS_NATIVE_SMOKE: '1'
          RUNENWERK_BOIDS_NATIVE_NO_READBACK: '1'
          RUNENWERK_G5_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            cargo +stable run -p engine --example boids_render_flow --locked
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            cargo +stable run -p engine --example boids_render_flow --locked -- --species

      - name: Prove Engine-owned PreUpdate GPU progress with Boids (source and readback)
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_BOIDS_NATIVE_SMOKE: '1'
          RUNENWERK_G5_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          # Exercise the default Engine-owned before-Update Gfx lifecycle.
          # These are separate real-GPU consumer runs:
          # original flocking verifies actual GPU image change; species
          # verifies source lineage without full-frame image readback.
          for mode in flocking species; do
            log="$(mktemp)"
            args=()
            if [ "$mode" = species ]; then
              args=(--species)
              export RUNENWERK_BOIDS_NATIVE_NO_READBACK=1
            else
              unset RUNENWERK_BOIDS_NATIVE_NO_READBACK
            fi
            if ! xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
                 cargo +stable run -p engine --example boids_render_flow --locked -- "${args[@]}" >"$log" 2>&1; then
              cat "$log"
              rm -f "$log"
              exit 1
            fi
            cat "$log"
            if ! grep -F "native_boids_gpu_smoke=pass" "$log"; then
              echo "Engine PreUpdate GPU Boids conformance marker missing" >&2
              rm -f "$log"
              exit 1
            fi
            if [ "$mode" = flocking ]; then
              grep -F "visual_readback=true" "$log"
            else
              grep -F "visual_readback=false" "$log"
            fi
            rm -f "$log"
          done

