name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Runenwerk validation
    uses: dornglut/github-workflows/.github/workflows/reusable-rust-cargo-validate.yml@72103b957ed506b843c2db2f87d663af7413c646

  runenrender-r6-vulkan-execution:
    name: RunenRender Vulkan execution proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve expected revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) expected_revision="$PULL_REQUEST_HEAD_SHA" ;;
            merge_group) expected_revision="$EVENT_SHA" ;;
            push|workflow_dispatch) expected_revision="$EVENT_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$expected_revision"
          echo "expected_revision=$expected_revision" >> "$GITHUB_OUTPUT"

      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.expected_revision }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prove checked-out revision
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          echo "Expected revision: $EXPECTED_REVISION"
          echo "Actual revision:   $actual_revision"
          test "$actual_revision" = "$EXPECTED_REVISION"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Mesa Vulkan fallback
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools xvfb xauth libxkbcommon-x11-0
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "Lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=${RUNNER_TEMP}/runenrender-vulkan-xdg" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/runenrender-vulkan-xdg"
          chmod 700 "${RUNNER_TEMP}/runenrender-vulkan-xdg"

      - name: Prove Vulkan software adapter
        run: vulkaninfo --summary

      - name: Run native window authority smokes
        env:
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          RUNENWERK_SURFACE_IDENTITY_NATIVE_SMOKE=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              cargo +stable test -p runenwerk_editor \
                --test region_compass_visual_capture \
                --locked
          RUNENWERK_NATIVE_NO_RENDER_SMOKE=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              cargo +stable test -p engine \
                --test native_host_smoke \
                --locked
          RUNENWERK_NATIVE_RENDER_HOST_SMOKE=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              cargo +stable test -p engine \
                --test native_host_smoke \
                --locked

      - name: Run complete R6 public-RunenGPU execution proof module
        env:
          RUST_BACKTRACE: '1'
          RUNENRENDER_R6_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          cargo +stable test -p engine \
            r6_spine_proof::execution \
            --locked -- --nocapture --test-threads=1

      - name: Run maintained R7 same-submission verification proof module
        env:
          RUST_BACKTRACE: '1'
          RUNENRENDER_R7_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          cargo +stable test -p engine \
            deterministic_execution_r7_proof \
            --locked -- --nocapture --test-threads=1
          cargo +stable test -p engine \
            deterministic_composition_r7_proof \
            --locked -- --nocapture --test-threads=1

      - name: Run Render Lab founding-direct artifact proof
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_SOURCE_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          cargo +stable run -p runenwerk_render_lab --locked -- render-lab
          test -s render-lab/founding-direct/radiance.png
          test -s render-lab/founding-direct/evidence.json
          jq -e '.classification == "pass" and .width == 128 and .height == 128 and .oracle.result == "pass"' \
            render-lab/founding-direct/evidence.json

      - name: Upload Render Lab founding-direct artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: runenwerk-render-lab-founding-direct
          path: render-lab/founding-direct
          if-no-files-found: error
          retention-days: 7

      - name: Run Render Lab static-footprint quality evidence matrix
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_SOURCE_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          root="render-lab/temporal-quality"
          rm -rf "${root}"
          mkdir -p "${root}"

          run_quality() {
            label="$1"
            internal="$2"
            output="${root}/${label}"
            timeout 30s xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              cargo +stable run -p runenwerk_render_lab --locked -- \
                --rl2-quality "${output}" \
                --window-size-px 1920x1080 \
                --internal-size-px "${internal}" \
                --submitted-frames 6

            test -s "${output}/quality-evidence.json"
            test -s "${output}/captures/run_manifest.json"
            jq -e \
              --arg revision "${RUNENWERK_SOURCE_REVISION}" \
              --arg internal "${internal}" \
              --argjson evaluation_width "${internal%x*}" \
              --argjson evaluation_height "${internal#*x}" \
              '
                .schema_version == 5
                and .scenario_revision == 5
                and .source_git_revision == $revision
                and .requested_output_size_px == [1920,1080]
                and .capture_submission_ordinal == 6
                and .total_submitted_frames >= 6
                and .capture.terminal == "completed"
                and (.capture.artifact_blake3 | startswith("blake3:"))
                and .gpu.backend == "vulkan"
                and .gpu.software_status == "software"
                and (.gpu.evidence_profile_fingerprint | startswith("blake3:"))
                and .execution.policy == "static_footprint"
                and (.temporal_reconstruction | length) == 6
                and all(.temporal_reconstruction[];
                  .requested_size_px == [1920,1080]
                  and .evaluation_size_px == [$evaluation_width,$evaluation_height]
                  and .sequence_revision == 1
                  and .reconstruction_revision == 1
                )
                and .temporal_reconstruction[0].semantic_input_generation_classes == [1,1]
                and .temporal_reconstruction[0].phase == 0
                and .temporal_reconstruction[0].history_age == 0
                and .temporal_reconstruction[0].history_reset == true
                and .temporal_reconstruction[1].semantic_input_generation_classes == [1,1]
                and .temporal_reconstruction[1].phase == 1
                and .temporal_reconstruction[1].history_age == 1
                and .temporal_reconstruction[1].history_reset == false
                and .temporal_reconstruction[1].history_generation
                    == .temporal_reconstruction[0].history_generation
                and .temporal_reconstruction[2].semantic_input_generation_classes == [2,2]
                and .temporal_reconstruction[2].phase == 0
                and .temporal_reconstruction[2].history_age == 0
                and .temporal_reconstruction[2].history_reset == true
                and .temporal_reconstruction[2].history_generation
                    != .temporal_reconstruction[0].history_generation
                and .temporal_reconstruction[3].semantic_input_generation_classes == [2,2]
                and .temporal_reconstruction[3].phase == 1
                and .temporal_reconstruction[3].history_age == 1
                and .temporal_reconstruction[3].history_reset == false
                and .temporal_reconstruction[3].history_generation
                    == .temporal_reconstruction[2].history_generation
                and .temporal_reconstruction[4].semantic_input_generation_classes == [2,2]
                and .temporal_reconstruction[4].phase == 2
                and .temporal_reconstruction[4].history_age == 2
                and .temporal_reconstruction[4].history_reset == false
                and .temporal_reconstruction[4].history_generation
                    == .temporal_reconstruction[2].history_generation
                and .temporal_reconstruction[5].semantic_input_generation_classes == [2,2]
                and .temporal_reconstruction[5].phase == 3
                and .temporal_reconstruction[5].history_age == 3
                and .temporal_reconstruction[5].history_reset == false
                and .temporal_reconstruction[5].history_generation
                    == .temporal_reconstruction[2].history_generation
                and .execution.native_fallback_active == false
                and .execution.target_key == null
                and .execution.internal_view_id == null
                and .execution.scene_invocation_id != null
                and .execution.resolve_invocation_id == null
                and .capture_route == "native_scene"
                and (.capture.flow_id | length) > 0
                and (.capture.pass_id | length) > 0
              ' "${output}/quality-evidence.json"
          }

          run_quality P100 1920x1080
          run_quality P075 1440x810
          run_quality P067 1280x720
          run_quality P050 960x540

          reference_format=""
          for label in P100 P075 P067 P050; do
            manifest="$(jq -r '.frame_manifests[0]' "${root}/${label}/captures/run_manifest.json")"
            test -n "${manifest}"
            test -s "${manifest}"
            capture_count="$(jq '.captures | length' "${manifest}")"
            test "${capture_count}" -eq 1
            format="$(jq -r '.captures[0].format' "${manifest}")"
            width="$(jq -r '.captures[0].width' "${manifest}")"
            height="$(jq -r '.captures[0].height' "${manifest}")"
            terminal="$(jq -r '.captures[0].terminal_code' "${manifest}")"
            test "${width}" -eq 1920
            test "${height}" -eq 1080
            test "${terminal}" = "completed"
            if [[ -z "${reference_format}" ]]; then
              reference_format="${format}"
            else
              test "${format}" = "${reference_format}"
            fi
          done

      - name: Upload Render Lab static-footprint quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: runenwerk-render-lab-temporal-quality
          path: render-lab/temporal-quality
          if-no-files-found: error
          retention-days: 7

      - name: Run Render Lab P100 camera-motion reprojection proof
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_SOURCE_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          output="render-lab/temporal-camera-quality"
          rm -rf "${output}"

          timeout 30s xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            cargo +stable run -p runenwerk_render_lab --locked -- \
              --rl2-camera-quality "${output}" \
              --window-size-px 1920x1080 \
              --submitted-frames 4

          evidence="${output}/camera-motion-evidence.json"
          test -s "${evidence}"
          test -s "${output}/captures/run_manifest.json"
          jq -e \
            --arg revision "${RUNENWERK_SOURCE_REVISION}" \
            '
              .schema_version == 1
              and .scenario_id == "runenwerk.render_lab.rl2.camera_motion_p100"
              and .scenario_revision == 1
              and .source_git_revision == $revision
              and .requested_output_size_px == [1920,1080]
              and .capture_submission_ordinal == 4
              and .total_submitted_frames >= 4
              and .gpu.backend == "vulkan"
              and .gpu.software_status == "software"
              and (.gpu.evidence_profile_fingerprint | startswith("blake3:"))
              and .execution.policy == "static_footprint"
              and .execution.internal_size_px == [1920,1080]
              and .execution.output_size_px == [1920,1080]
              and .execution.native_fallback_active == false
              and .execution.resolve_invocation_id == null
              and .capture_route == "native_scene"
              and .capture.terminal == "completed"
              and (.capture.artifact_blake3 | startswith("blake3:"))
              and (.frames | length) == 4
              and all(.frames[];
                .requested_size_px == [1920,1080]
                and .evaluation_size_px == [1920,1080]
                and .semantic_input_generation_classes == [1,1]
                and .camera_reprojection_eligible == true
                and .camera_reprojection_revision == 1
                and .depth_policy_revision == 1
              )
              and .frames[0].phase == 0
              and .frames[0].history_age == 0
              and .frames[0].history_reset == true
              and .frames[0].previous_observation_available == false
              and .frames[0].camera_pose_changed == false
              and .frames[1].phase == 1
              and .frames[1].history_age == 1
              and .frames[1].history_reset == false
              and .frames[1].previous_observation_available == true
              and .frames[1].camera_pose_changed == false
              and .frames[1].history_generation == .frames[0].history_generation
              and .frames[2].phase == 2
              and .frames[2].history_age == 2
              and .frames[2].history_reset == false
              and .frames[2].previous_observation_available == true
              and .frames[2].camera_pose_changed == true
              and .frames[2].history_generation == .frames[0].history_generation
              and .frames[3].phase == 3
              and .frames[3].history_age == 3
              and .frames[3].history_reset == false
              and .frames[3].previous_observation_available == true
              and .frames[3].camera_pose_changed == true
              and .frames[3].history_generation == .frames[0].history_generation
            ' "${evidence}"

      - name: Upload Render Lab P100 camera-motion reprojection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: runenwerk-render-lab-camera-motion
          path: render-lab/temporal-camera-quality
          if-no-files-found: error
          retention-days: 7

      - name: Run Render Lab synchronized A/B comparison proof
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_SOURCE_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          output="render-lab/comparison"
          rm -rf "${output}"

          timeout 30s xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            cargo +stable run -p runenwerk_render_lab --locked -- \
              --rl2-compare-evidence "${output}" \
              --window-size-px 1920x1080 \
              --candidate-size-px 960x540 \
              --submitted-frames 6

          run_manifest="${output}/captures/run_manifest.json"
          test -s "${run_manifest}"
          frame_manifest="$(jq -r '.frame_manifests[0]' "${run_manifest}")"
          test -n "${frame_manifest}"
          test -s "${frame_manifest}"

          jq -e '
            .captures | length == 2
            and all(.[];
              .frame_index == .[0].frame_index
              and .width == 1920
              and .height == 1080
              and .terminal_code == "completed"
              and (.file | type == "string" and length > 0)
            )
            and ([.[].resource_id] | sort)
              == ["rl2.compare.display_a","rl2.compare.display_b"]
          ' "${frame_manifest}"

          while IFS= read -r capture_file; do
            test -s "${capture_file}"
          done < <(jq -r '.captures[].file' "${frame_manifest}")

      - name: Upload Render Lab synchronized A/B comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: runenwerk-render-lab-comparison
          path: render-lab/comparison
          if-no-files-found: error
          retention-days: 7
