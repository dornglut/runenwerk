          RUNENWERK_BOIDS_NATIVE_SMOKE: '1'
          RUNENWERK_G5_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          for mode in capped:120 uncapped; do
            args=(--host-pacing "$mode")
            if [ "$mode" = uncapped ]; then args+=(--species); fi
            log="$(mktemp)"
            if ! xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
                 cargo +stable run -p engine --example boids_render_flow --locked -- "${args[@]}" >"$log" 2>&1; then
              cat "$log"
              rm -f "$log"
              exit 1
            fi
            if ! grep -F "native_boids_gpu_smoke=pass" "$log"; then
              cat "$log"
              echo "Boids Host CLI mode $mode did not complete actual GPU continuity smoke" >&2
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          done

