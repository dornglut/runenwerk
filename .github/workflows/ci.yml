name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Runenwerk validation
    uses: dornglut/github-workflows/.github/workflows/reusable-rust-cargo-validate.yml@72103b957ed506b843c2db2f87d663af7413c646

  runenrender-r6-vulkan-native:
    name: RunenRender Vulkan native/arena/consumer proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Resolve expected revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) expected_revision="$PULL_REQUEST_HEAD_SHA" ;;
            merge_group) expected_revision="$EVENT_SHA" ;;
            push|workflow_dispatch) expected_revision="$EVENT_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$expected_revision"
          echo "expected_revision=$expected_revision" >> "$GITHUB_OUTPUT"

      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.expected_revision }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prove checked-out revision
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          echo "Expected revision: $EXPECTED_REVISION"
          echo "Actual revision:   $actual_revision"
          test "$actual_revision" = "$EXPECTED_REVISION"

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      # The remote GHA compiler cache has an account-level egress quota; required
      # merge-group validation must remain executable without that service.
      - name: Set up Rust compiler cache
        if: github.event_name != 'merge_group'
        uses: "Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba" # v0.0.11
        with:
          version: "v0.18.0"

      - name: Configure Rust compiler cache
        run: |
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" != "merge_group" ]; then
            {
              echo "SCCACHE_GHA_ENABLED=on"
              echo "RUSTC_WRAPPER=sccache"
            } >> "$GITHUB_ENV"
          fi

      - name: Install Mesa Vulkan fallback
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools xvfb xauth libxkbcommon-x11-0
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "Lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=${RUNNER_TEMP}/runenrender-vulkan-xdg" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/runenrender-vulkan-xdg"
          chmod 700 "${RUNNER_TEMP}/runenrender-vulkan-xdg"

      - name: Prove Vulkan software adapter
        run: vulkaninfo --summary

      - name: Run native window authority smokes
        env:
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          RUNENWERK_SURFACE_IDENTITY_NATIVE_SMOKE=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              cargo +stable test -p runenwerk_editor \
                --test region_compass_visual_capture \
                --locked
          RUNENWERK_NATIVE_NO_RENDER_SMOKE=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              cargo +stable test -p engine \
                --test native_host_smoke \
                --locked
          RUNENWERK_NATIVE_UNCAPPED_HOST_SMOKE=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              cargo +stable test -p engine \
                --test native_host_smoke \
                --locked
          RUNENWERK_NATIVE_RENDER_HOST_SMOKE=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              cargo +stable test -p engine \
                --test native_host_smoke \
                --locked
          RUNENWERK_NATIVE_HISTORICAL_GPU_SMOKE=1 \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              cargo +stable test -p engine \
                --test native_host_smoke \
                --locked

      - name: Prove actual Arena native capped and uncapped launch modes
        env:
          RUNENWERK_ARENA_NATIVE_LAUNCH_SMOKE: '1'
        run: |
          set -euo pipefail
          cargo +stable build -p runenwerk_arena --locked
          for mode in capped:120 uncapped; do
            expected=continuous_capped
            if [ "$mode" = uncapped ]; then expected=continuous_uncapped; fi
            log="$(mktemp)"
            if ! timeout 180s xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
                 target/debug/runenwerk_arena --host-pacing "$mode" >"$log" 2>&1; then
              cat "$log"
              rm -f "$log"
              exit 1
            fi
            if ! grep -F "native_arena_host_cli=pass frames=" "$log" ||
               ! grep -F "mode=$expected" "$log"; then
              cat "$log"
              echo "Arena did not complete native frame/Host mode proof for $mode" >&2
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          done

      - name: Reject invalid Boids and Arena native launch arguments before startup
        run: |
          set -euo pipefail
          for package in boids arena; do
            log="$(mktemp)"
            if [ "$package" = boids ]; then
              command=(cargo +stable run -p engine --example boids_render_flow --locked -- --host-pacing=capped:0)
            else
              command=(cargo +stable run -p runenwerk_arena --locked -- --host-pacing=capped:0)
            fi
            if timeout 180s "${command[@]}" >"$log" 2>&1; then
              cat "$log"
              echo "$package accepted invalid capped FPS" >&2
              rm -f "$log"
              exit 1
            fi
            if ! grep -F "outside 1..=240" "$log"; then
              cat "$log"
              echo "$package did not reject the request for the expected Host pacing reason" >&2
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          done

      - name: Prove native product CLI help, exit and OS argument admission
        run: |
          set -euo pipefail
          cargo +stable build -p engine --example boids_render_flow --locked
          cargo +stable build -p runenwerk_arena --locked
          for product in boids arena; do
            if [ "$product" = boids ]; then
              binary=target/debug/examples/boids_render_flow
              usage="Usage: boids_render_flow"
            else
              binary=target/debug/runenwerk_arena
              usage="Usage: runenwerk_arena"
            fi
            for help in --help -h; do
              log="$(mktemp)"
              timeout 30s "$binary" "$help" >"$log" 2>&1 || { cat "$log"; exit 1; }
              grep -F "$usage" "$log" || { cat "$log"; exit 1; }
              rm -f "$log"
            done
            check_bad() {
              local expected="$1"
              shift
              local log status
              log="$(mktemp)"
              status=0
              timeout 30s "$binary" "$@" >"$log" 2>&1 || status=$?
              if [ "$status" -ne 1 ] || ! grep -F -- "$expected" "$log"; then
                cat "$log"
                echo "Invalid $product CLI: unexpected exit or diagnostic ($status)" >&2
                rm -f "$log"
                exit 1
              fi
              rm -f "$log"
            }
            check_bad "unexpected" --unknown
            check_bad "unexpected" --
            check_bad "requires MODE" --host-pacing
            check_bad "outside 1..=240" --host-pacing=capped:0
            check_bad "duplicate --host-pacing" --host-pacing=uncapped --host-pacing=capped
            check_bad "MODE must be UTF-8" --host-pacing $'\xff'
            check_bad "unexpected" $'\xff'
            if [ "$product" = boids ]; then
              check_bad "duplicate Boids" --species --species
              check_bad "only valid for interactive Boids" --evidence --host-pacing=uncapped
            fi
          done

      - name: Prove native on-demand launch idle and worker wake
        env:
          RUNENWERK_NATIVE_HOST_LAUNCH_IDLE_WAKE_SMOKE: '1'
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if ! timeout 180s xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
               cargo +stable test -p engine --lib \
                 runtime::native_host_wake::tests::native_idle_wake_reaches_real_thread_affine_runtime \
                 --locked -- --exact --nocapture --test-threads=1 >"$log" 2>&1; then
            cat "$log"
            rm -f "$log"
            exit 1
          fi
          if ! grep -F "native_launch_idle_wake_smoke=pass" "$log"; then
            cat "$log"
            echo "OnDemand CLI policy did not complete native idle/wake proof" >&2
            rm -f "$log"
            exit 1
          fi
          rm -f "$log"

      - name: Run maintained arena presentation GPU proof
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_ARENA_GPU_SMOKE: '1'
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            cargo +stable test -p runenwerk_arena \
              --test arena_presentation_gpu \
              --locked -- --ignored --exact --nocapture --test-threads=1

      - name: Run standalone RunenRender public consumer proof
        env:
          RUST_BACKTRACE: '1'
          RUNENRENDER_R8_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          cargo +stable test -p engine \
            --test runenrender_ordinary_public_api \
            --locked -- --nocapture --test-threads=1

      - name: Prove downstream retained cross-frame G5 submission semantics
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_G5_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          cargo +stable test -p engine \
            --test render_gpu_retained_cross_frame \
            --locked -- --nocapture --test-threads=1

      - name: Prove downstream fixed GPU step continuity under deferred frames
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_G5_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          cargo +stable test -p engine \
            --test render_gpu_fixed_step_continuity \
            --locked -- --nocapture --test-threads=1

      - name: Prove producer checkpoint reimport after G5 context failure
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_G5_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          cargo +stable test -p engine --lib \
            accepted_unknown_write_requires_verified_checkpoint_reimport_before_replay \
            --locked -- --nocapture --test-threads=1

