              echo "RUSTC_WRAPPER=sccache"
            } >> "$GITHUB_ENV"
          fi

      - name: Install Mesa Vulkan fallback
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools xvfb xauth libxkbcommon-x11-0
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "Lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=${RUNNER_TEMP}/runenrender-vulkan-xdg" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/runenrender-vulkan-xdg"
          chmod 700 "${RUNNER_TEMP}/runenrender-vulkan-xdg"

      - name: Prove Vulkan software adapter
        run: vulkaninfo --summary

      - name: Run Boids example-local unit and shader-contract tests
        run: cargo +stable test -p engine --example boids_render_flow --locked

      - name: Prove Boids producer fail-stop before fresh native source epoch
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_BOIDS_NATIVE_SMOKE: '1'
          RUNENWERK_G5_REQUIRE_GPU: '1'
          RUNENWERK_BOIDS_NATIVE_SOURCE_FAULT_AFTER_TICK: '12'
        run: |
          set -euo pipefail
          for mode in flocking species; do
            log="$(mktemp)"
            args=()
            if [ "$mode" = species ]; then args=(--species); fi
            if xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
                 cargo +stable run -p engine --example boids_render_flow --locked -- "${args[@]}" >"$log" 2>&1; then
              cat "$log"
              echo "Expected injected Boids source rejection, but the process exited successfully" >&2
              rm -f "$log"
              exit 1
            fi
            if ! grep -F "Boids native injected source fault after verified GPU tick" "$log"; then
              cat "$log"
              echo "Native Boids did not exit for the intended producer fault" >&2
              rm -f "$log"
              exit 1
            fi
            echo "native_boids_source_fail_stop=pass mode=$mode"
            rm -f "$log"
          done

      - name: Run real original and species Boids native GPU continuity proof
        env:
          RUST_BACKTRACE: '1'
          RUNENWERK_BOIDS_NATIVE_SMOKE: '1'
          RUNENWERK_G5_REQUIRE_GPU: '1'
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            cargo +stable run -p engine --example boids_render_flow --locked
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            cargo +stable run -p engine --example boids_render_flow --locked -- --species

