name: Temporary S2 editor closure

on:
  push:
    branches:
      - tmp-s2-lock-repair-366

permissions:
  contents: write

jobs:
  repair-editor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Apply editor consumer closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manifest = Path('apps/runenwerk_editor/Cargo.toml')
          text = manifest.read_text()
          needle = 'resource_ref.workspace = true\ntexture.workspace = true\n'
          replacement = 'resource_ref.workspace = true\nrunen-spatial.workspace = true\ntexture.workspace = true\n'
          if 'runen-spatial.workspace = true' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('editor manifest insertion point not found exactly once')
              text = text.replace(needle, replacement)
          manifest.write_text(text)

          jobs = Path('apps/runenwerk_editor/src/asset_pipeline/field_product_jobs.rs')
          text = jobs.read_text()
          replacements = {
              'use spatial::{ChunkCoord3, ChunkId, WorldId};': 'use runen_spatial::{ChunkCoord3, ChunkId, WorldId};',
              'WorldId(1)': 'WorldId::new(1)',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected field-product pattern not found exactly once: {old}')
              text = text.replace(old, new)
          jobs.write_text(text)

          publication = Path('apps/runenwerk_editor/src/asset_pipeline/product_publication.rs')
          text = publication.read_text()
          expected = {
              'spatial::ChunkId::new(': 2,
              'spatial::WorldId(1)': 2,
              'spatial::ChunkCoord3 { x: 0, y: 0, z: 0 }': 2,
          }
          for pattern, count in expected.items():
              if text.count(pattern) != count:
                  raise SystemExit(f'expected publication pattern count {count}, got {text.count(pattern)}: {pattern}')
          text = text.replace('spatial::ChunkId::new(', 'runen_spatial::ChunkId::new(')
          text = text.replace('spatial::WorldId(1)', 'runen_spatial::WorldId::new(1)')
          text = text.replace(
              'spatial::ChunkCoord3 { x: 0, y: 0, z: 0 }',
              'runen_spatial::ChunkCoord3 { x: 0, y: 0, z: 0 }',
          )
          publication.write_text(text)

          runtime = Path('apps/runenwerk_editor/src/runtime/procgen/mod.rs')
          text = runtime.read_text()
          import_old = 'use spatial::{ChunkCoord3, ChunkId, RegionCoord3, RegionId, WorldId};'
          if text.count(import_old) != 1:
              raise SystemExit('expected procgen import not found exactly once')
          text = text.replace(
              import_old,
              'use runen_spatial::{ChunkCoord3, ChunkId, RegionCoord3, RegionId, WorldId};',
          )
          if text.count('scope.world_id.0') != 1:
              raise SystemExit('expected procgen world_id reach-through not found exactly once')
          text = text.replace('scope.world_id.0', 'scope.world_id.get()')
          if text.count('WorldId(1)') != 4:
              raise SystemExit(f'expected four tuple WorldId constructions, got {text.count("WorldId(1)")}')
          text = text.replace('WorldId(1)', 'WorldId::new(1)')
          runtime.write_text(text)
          PY

          if grep -R -nE '(^|[^[:alnum:]_])spatial::|use spatial|world_id\.0|WorldId\(' apps/runenwerk_editor/src; then
            echo 'legacy spatial representation residue remains in runenwerk_editor' >&2
            exit 1
          fi

      - name: Resolve direct dependency edge and compile editor
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable metadata --format-version 1 > /dev/null
          cargo +stable fmt --all --check
          cargo +stable check -p runenwerk_editor --locked
          changed="$(git diff --name-only | sort)"
          expected=$'Cargo.lock\napps/runenwerk_editor/Cargo.toml\napps/runenwerk_editor/src/asset_pipeline/field_product_jobs.rs\napps/runenwerk_editor/src/asset_pipeline/product_publication.rs\napps/runenwerk_editor/src/runtime/procgen/mod.rs'
          test "$changed" = "$expected"

      - name: Commit editor closure only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock \
            apps/runenwerk_editor/Cargo.toml \
            apps/runenwerk_editor/src/asset_pipeline/field_product_jobs.rs \
            apps/runenwerk_editor/src/asset_pipeline/product_publication.rs \
            apps/runenwerk_editor/src/runtime/procgen/mod.rs
          git diff --cached --quiet && exit 0
          git commit -m "spatial: close editor consumers over RunenSpatial"
          git push origin HEAD:tmp-s2-lock-repair-366
