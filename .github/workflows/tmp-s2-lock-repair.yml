name: Temporary S2 source repair

on:
  push:
    branches:
      - tmp-s2-lock-repair-366

permissions:
  contents: write

jobs:
  repair-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply procgen coordinate-width repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('domain/procgen/src/field_preview.rs')
          text = path.read_text()
          old = '''fn corner_noise(
              document: &ProcgenDocument,
              chunk_id: ChunkId,
              x: i32,
              z: i32,
          '''
          new = '''fn corner_noise(
              document: &ProcgenDocument,
              chunk_id: ChunkId,
              x: i64,
              z: i64,
          '''
          if text.count(old) != 1:
              raise SystemExit('expected corner_noise signature not found exactly once')
          path.write_text(text.replace(old, new))
          PY
          changed="$(git diff --name-only)"
          test "$changed" = "domain/procgen/src/field_preview.rs"

      - name: Commit source repair only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain/procgen/src/field_preview.rs
          git diff --cached --quiet && exit 0
          git commit -m "spatial: widen procgen corner offsets"
          git push origin HEAD:tmp-s2-lock-repair-366
