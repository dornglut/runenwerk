name: Documentation Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve expected revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) expected_revision="$PULL_REQUEST_HEAD_SHA" ;;
            push|workflow_dispatch) expected_revision="$EVENT_SHA" ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          test -n "$expected_revision"
          echo "expected_revision=$expected_revision" >> "$GITHUB_OUTPUT"
          echo "pull_request_base_revision=$PULL_REQUEST_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.expected_revision }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prove checked-out revision
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
          PULL_REQUEST_BASE_REVISION: ${{ steps.revision.outputs.pull_request_base_revision }}
        run: |
          set -euo pipefail
          actual_revision="$(git rev-parse HEAD)"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Expected revision: $EXPECTED_REVISION"
          echo "Actual checked-out revision: $actual_revision"
          if [ -n "$PULL_REQUEST_BASE_REVISION" ]; then echo "Pull-request base revision: $PULL_REQUEST_BASE_REVISION"; fi
          test "$actual_revision" = "$EXPECTED_REVISION"
          echo "Conclusion: PASS"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.0.0

      - name: Install documentation dependencies
        run: pnpm --dir docs-site install --frozen-lockfile

      - name: Build documentation site
        id: build
        env:
          EXPECTED_REVISION: ${{ steps.revision.outputs.expected_revision }}
          PULL_REQUEST_BASE_REVISION: ${{ steps.revision.outputs.pull_request_base_revision }}
        run: |
          set +e
          log_path="${RUNNER_TEMP}/runenwerk-documentation-build.log"
          pnpm --dir docs-site build >"$log_path" 2>&1
          build_status=$?
          set -e
          actual_revision="$(git rev-parse HEAD)"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Expected revision: $EXPECTED_REVISION"
          echo "Actual checked-out revision: $actual_revision"
          if [ -n "$PULL_REQUEST_BASE_REVISION" ]; then echo "Pull-request base revision: $PULL_REQUEST_BASE_REVISION"; fi
          echo "Canonical command: pnpm --dir docs-site build"
          if [ "$build_status" -eq 0 ]; then echo "Conclusion: PASS"; exit 0; fi
          echo "Conclusion: FAIL"
          sed -n '1,120p' "$log_path" || true
          tail -n 120 "$log_path" || true
          exit "$build_status"

      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: documentation-build-diagnostics
          path: ${{ runner.temp }}/runenwerk-documentation-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Remove build diagnostics
        if: always()
        run: rm -f "${RUNNER_TEMP}/runenwerk-documentation-build.log"

      - name: Check diff hygiene
        run: git diff --check

      - name: Prove build leaves tracked state clean
        run: |
          status="$(git status --short)"
          if [ -n "$status" ]; then
            printf 'Documentation build changed tracked state:\n%s\n' "$status" >&2
            exit 1
          fi

  s2-closure:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 1

      - name: Apply asserted S2 closure fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1))

          for name in [
              "engine/src/plugins/render/features/world/sdf_residency.rs",
              "engine/src/plugins/render/frame/contributions.rs",
              "engine/src/plugins/render/inspect/sdf_residency.rs",
          ]:
              replace_once(Path(name), "use spatial::ChunkId;", "use runen_spatial::ChunkId;", "standalone ChunkId import")

          plugin = Path("engine/src/plugins/world/plugin.rs")
          replace_once(
              plugin,
              "        CaveLightingScopeResource, CavePortalGraphResource, CaveSectorResource,\n        CollisionQueryServiceResource, OperationLogResource, PartitionConfigResource,\n",
              "        BuildGraphResource, BuildQueueResource, CaveLightingScopeResource, CavePortalGraphResource,\n        CaveSectorResource, CollisionQueryServiceResource, OperationLogResource, PartitionConfigResource,\n",
              "world build resource imports",
          )

          ingress = Path("engine/src/plugins/world/edits/ingress.rs")
          replace_once(
              ingress,
              "    let quantization_scale = *world.resource::<WorldQuantizationScaleResource>().ok()?;\n",
              "    let quantization_scale = **world.resource::<WorldQuantizationScaleResource>().ok()?;\n",
              "quantization resource copy",
          )
          replace_once(
              ingress,
              "        *quantization_scale,\n",
              "        quantization_scale,\n",
              "quantization scale value",
          )

          metrics = Path("engine/src/plugins/world/debug/metrics.rs")
          replace_once(
              metrics,
              "    pub completed_build_jobs: u64,\n",
              "    pub completed_build_jobs: u64,\n    pub build_spatial_mapping_failures: u64,\n",
              "build mapping failure metric",
          )

          jobs = Path("engine/src/plugins/world/build/jobs.rs")
          text = jobs.read_text()
          replacements = [
              (
                  "use runen_spatial::{ChunkId, GridPartitionConfig};",
                  "use runen_spatial::{ChunkId, GridPartitionConfig, SpatialMathError};",
                  "build spatial error import",
              ),
              (
                  "    pub completed_jobs: u64,\n    pub dropped_jobs: u64,\n",
                  "    pub completed_jobs: u64,\n    pub dropped_jobs: u64,\n    pub spatial_mapping_failures: u64,\n",
                  "build runtime metric field",
              ),
              (
                  "            completed_jobs: 0,\n            dropped_jobs: 0,\n",
                  "            completed_jobs: 0,\n            dropped_jobs: 0,\n            spatial_mapping_failures: 0,\n",
                  "build runtime metric default",
              ),
              (
                  "    debug.completed_build_jobs = runtime.completed_jobs;\n",
                  "    debug.completed_build_jobs = runtime.completed_jobs;\n    debug.build_spatial_mapping_failures = runtime.spatial_mapping_failures;\n",
                  "build debug metric assignment",
              ),
          ]
          for old, new, label in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, found {text.count(old)}")
              text = text.replace(old, new, 1)

          old_dispatch = '''        let record = chunks.ensure_chunk(item.chunk_id);
        if !matches!(
            record.lifecycle,
            ChunkLifecycleState::Dirty | ChunkLifecycleState::Rebuilding
        ) {
            runtime.dropped_jobs = runtime.dropped_jobs.saturating_add(1);
            continue;
        }

        let target_chunk_revision = ChunkRevision(record.chunk_revision.0.saturating_add(1));
        let target_build_generation = BuildGeneration(record.build_generation.0.saturating_add(1));
        // Dirty reasons are consumed by this build generation. Any new dirty reasons that arrive
        // while rebuilding will be merged back by lifecycle and trigger follow-up rebuilds.
        record.dirty_reasons = DirtyReasonSet::default();
        record.pending_build_generation = Some(target_build_generation);
        record.lifecycle = ChunkLifecycleState::Rebuilding;

        push_phase_nodes(
            &mut graph,
            item.chunk_id,
            target_chunk_revision,
            target_build_generation,
        );

        let payload = build_chunk_payload_from_op_window(
            item.chunk_id,
            target_chunk_revision,
            target_build_generation,
            &partition,
            &op_log,
            **quantization_scale,
        );
'''
          new_dispatch = '''        let (target_chunk_revision, target_build_generation) = {
            let record = chunks.ensure_chunk(item.chunk_id);
            if !matches!(
                record.lifecycle,
                ChunkLifecycleState::Dirty | ChunkLifecycleState::Rebuilding
            ) {
                runtime.dropped_jobs = runtime.dropped_jobs.saturating_add(1);
                continue;
            }
            (
                ChunkRevision(record.chunk_revision.0.saturating_add(1)),
                BuildGeneration(record.build_generation.0.saturating_add(1)),
            )
        };

        let payload = match build_chunk_payload_from_op_window(
            item.chunk_id,
            target_chunk_revision,
            target_build_generation,
            &partition,
            &op_log,
            **quantization_scale,
        ) {
            Ok(payload) => payload,
            Err(_) => {
                runtime.dropped_jobs = runtime.dropped_jobs.saturating_add(1);
                runtime.spatial_mapping_failures = runtime.spatial_mapping_failures.saturating_add(1);
                continue;
            }
        };

        let record = chunks.ensure_chunk(item.chunk_id);
        // Consume dirty state only after checked spatial mapping succeeds. A mapping failure leaves
        // the chunk Dirty and retryable instead of silently treating the operation as unrelated.
        record.dirty_reasons = DirtyReasonSet::default();
        record.pending_build_generation = Some(target_build_generation);
        record.lifecycle = ChunkLifecycleState::Rebuilding;

        push_phase_nodes(
            &mut graph,
            item.chunk_id,
            target_chunk_revision,
            target_build_generation,
        );
'''
          if text.count(old_dispatch) != 1:
              raise SystemExit(f"build dispatch block: expected one match, found {text.count(old_dispatch)}")
          text = text.replace(old_dispatch, new_dispatch, 1)

          old = ") -> SdfChunkPayload {\n    let affecting_ops = operations_affecting_chunk(op_log, partition, chunk_id, fixed_point_scale);\n"
          new = ") -> Result<SdfChunkPayload, SpatialMathError> {\n    let affecting_ops = operations_affecting_chunk(op_log, partition, chunk_id, fixed_point_scale)?;\n"
          if text.count(old) != 1:
              raise SystemExit("build payload signature mismatch")
          text = text.replace(old, new, 1)

          old = "    SdfChunkPayload {\n        chunk_id,\n"
          if text.count(old) != 1:
              raise SystemExit("build payload return mismatch")
          text = text.replace(old, "    Ok(SdfChunkPayload {\n        chunk_id,\n", 1)

          old = "        checksum: checksum_hasher.finish(),\n    }\n}\n\nfn operations_affecting_chunk<'a>(\n"
          if text.count(old) != 1:
              raise SystemExit("build payload close mismatch")
          text = text.replace(old, "        checksum: checksum_hasher.finish(),\n    })\n}\n\nfn operations_affecting_chunk<'a>(\n", 1)

          old_affecting = '''fn operations_affecting_chunk<'a>(
    op_log: &'a OperationLog,
    partition: &GridPartitionConfig,
    chunk_id: ChunkId,
    fixed_point_scale: WorldQuantizationScale,
) -> Vec<&'a OperationRecord> {
    op_log
        .operations
        .iter()
        .filter(|record| {
            if record.planet_id != chunk_id.world_id {
                return false;
            }
            touched_chunks_from_quantized_bounds(
                partition,
                record.affected_bounds_q,
                chunk_id.world_id,
                fixed_point_scale,
            )
            .map(|chunks| chunks.contains(&chunk_id))
            .unwrap_or(false)
        })
        .collect()
}
'''
          new_affecting = '''fn operations_affecting_chunk<'a>(
    op_log: &'a OperationLog,
    partition: &GridPartitionConfig,
    chunk_id: ChunkId,
    fixed_point_scale: WorldQuantizationScale,
) -> Result<Vec<&'a OperationRecord>, SpatialMathError> {
    let mut affecting = Vec::new();
    for record in &op_log.operations {
        if record.planet_id != chunk_id.world_id {
            continue;
        }
        let touched_chunks = touched_chunks_from_quantized_bounds(
            partition,
            record.affected_bounds_q,
            chunk_id.world_id,
            fixed_point_scale,
        )?;
        if touched_chunks.contains(&chunk_id) {
            affecting.push(record);
        }
    }
    Ok(affecting)
}
'''
          if text.count(old_affecting) != 1:
              raise SystemExit("operations_affecting_chunk mismatch")
          jobs.write_text(text.replace(old_affecting, new_affecting, 1))

          collision = Path("domain/world_sdf/src/collision.rs")
          text = collision.read_text()
          marker = '''    #[test]
    fn sweep_hits_first_occupied_chunk_along_path_bounds() {
'''
          restored_ready = '''    #[test]
    fn sweep_readiness_is_ready_when_all_required_chunks_are_loaded() {
        let service = CollisionQueryService;
        let partition = partition();
        let mut store = SdfChunkStore::default();
        let world_id = WorldId::new(0);
        for x in 0..=2 {
            let chunk = ChunkId::new(world_id, ChunkCoord3 { x, y: 0, z: 0 });
            store.chunks.insert(chunk, clear_payload(chunk));
        }
        let readiness = service
            .collision_readiness_for_sweep(
                &partition,
                &store,
                world_id,
                SphereSweep {
                    start: [0.1, 0.1, 0.1],
                    end: [2.1, 0.1, 0.1],
                    radius: 0.0,
                },
            )
            .expect("sweep bounds are valid");
        assert_eq!(readiness, CollisionReadiness::Ready);
    }

'''
          if text.count(marker) != 1:
              raise SystemExit("collision readiness marker mismatch")
          text = text.replace(marker, restored_ready + marker, 1)

          marker = '''    #[test]
    fn authoritative_sweep_distinguishes_clear_and_missing_payload() {
'''
          restored_partial = '''    #[test]
    fn sweep_can_stay_clear_inside_partial_occupancy_chunk() {
        let service = CollisionQueryService;
        let partition = partition();
        let mut store = SdfChunkStore::default();
        let world_id = WorldId::new(0);
        let chunk_id = ChunkId::new(world_id, ChunkCoord3::default());
        store
            .chunks
            .insert(chunk_id, uniform_page_payload(chunk_id, 0b1000_0000));
        let outcome = service
            .sweep_sphere_authoritative(
                &partition,
                &store,
                world_id,
                SphereSweep {
                    start: [0.1, 0.1, 0.1],
                    end: [0.9, 0.1, 0.1],
                    radius: 0.0,
                },
            )
            .expect("sweep query is spatially valid");
        assert_eq!(outcome, CollisionSweepOutcome::Clear);
    }

'''
          if text.count(marker) != 1:
              raise SystemExit("collision partial-occupancy marker mismatch")
          collision.write_text(text.replace(marker, restored_partial + marker, 1))

          Path(".github/workflows/s2-lock-artifact.yml").unlink(missing_ok=True)

      - name: Install stable Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Format and verify diff hygiene
        run: |
          cargo +stable fmt --all
          git diff --check

      - name: Commit closure fixes
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spatial: close S2 cutover review gaps"
          git push origin "HEAD:${HEAD_BRANCH}"
