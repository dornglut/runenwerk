name: RN8 N2 lockfile edge refresh

on:
  push:
    branches:
      - rn8-n2-engine-session-runennet-386

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn8-n2-engine-session-runennet-386

      - name: Add exact RunenNet dependency edges
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.lock")
          text = path.read_text()

          engine_old = ''' "resource_ref",
           "ron",
           "runen-spatial",
           "rusttype",'''
          engine_new = ''' "resource_ref",
           "ron",
           "runen-net",
           "runen-spatial",
           "rusttype",'''
          if engine_new not in text:
              if text.count(engine_old) != 1:
                  raise SystemExit("engine dependency edge anchor was not unique")
              text = text.replace(engine_old, engine_new, 1)

          engine_net_old = '''[[package]]
          name = "engine_net"
          version = "0.1.0"
          dependencies = [
           "ecs",
           "engine_net_macros",
           "engine_sim",
           "postcard",
           "serde",
          ]'''
          engine_net_new = '''[[package]]
          name = "engine_net"
          version = "0.1.0"
          dependencies = [
           "ecs",
           "engine_net_macros",
           "engine_sim",
           "postcard",
           "runen-net",
           "serde",
          ]'''
          if engine_net_new not in text:
              if text.count(engine_net_old) != 1:
                  raise SystemExit("engine_net dependency block anchor was not unique")
              text = text.replace(engine_net_old, engine_net_new, 1)

          path.write_text(text)
          PY

          git diff --check -- Cargo.lock
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already contains the exact RunenNet dependency edges"
            exit 0
          fi
          read additions deletions _ < <(git diff --numstat -- Cargo.lock)
          test "$additions" = "2"
          test "$deletions" = "0"
          git diff -- Cargo.lock

      - name: Commit generated lockfile edge refresh
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "RN8 N2: refresh lockfile dependency edges"
          git push origin HEAD:rn8-n2-engine-session-runennet-386
