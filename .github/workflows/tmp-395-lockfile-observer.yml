name: Temporary #395 Lockfile Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-lockfile:
    if: github.head_ref == 'fix/395-runennet-peer-close'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Verify exact pull-request head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Materialize canonical lockfile
        run: cargo +stable metadata --format-version 1 > /dev/null
      - name: Verify generated lockfile
        run: |
          test "$(sha256sum Cargo.lock | cut -d' ' -f1)" = "948e98b1f75f1f3a6735317d9ccba1f77dde946f09d1c988fe8d0cb9075467f2"
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already canonical."
            exit 0
          fi
          test "$(git diff --name-only)" = "Cargo.lock"
          git diff -- Cargo.lock
      - name: Commit canonical lockfile if needed
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: update RunenNet lockfile pin"
          git push origin HEAD:refs/heads/fix/395-runennet-peer-close
