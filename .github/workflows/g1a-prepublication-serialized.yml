name: G1A Prepublication Serialized

on:
  pull_request:
    branches:
      - validation/pt-runengpu-g1a-prepublication-serialized
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: issue-131-prepublication-serialized
  cancel-in-progress: true

jobs:
  validate-and-stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'validation/pt-runengpu-g1a-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout accepted implementation base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 88e9de3c94145c39391550efaf82a341630f081a
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Install maintained Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy

      - name: Fetch exact final validation runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          blob = "e5188f95b980835e65ceca41534105ce50543292"
          request = urllib.request.Request(
              f"https://api.github.com/repos/dornglut/runenwerk/git/blobs/{blob}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              runner = base64.b64decode(json.load(response)["content"])
          if len(runner) != 3_220:
              raise SystemExit(f"unexpected wrapper length: {len(runner)}")
          actual = hashlib.sha256(runner).hexdigest()
          expected = "5f3de032a229f3ba333253c0da71025e31b6c94f554224a610043411f368cacd"
          if actual != expected:
              raise SystemExit(f"wrapper mismatch: expected={expected} actual={actual}")
          path = Path(os.environ["RUNNER_TEMP"], "g1a-final-wrapper.sh")
          path.write_bytes(runner)
          path.chmod(0o700)
          PY

      - name: Validate and stage unreferenced source blobs
        shell: bash
        run: "$RUNNER_TEMP/g1a-final-wrapper.sh"

      - name: Upload validated blob manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-131-g1a-validated-blobs
          path: |
            ${{ runner.temp }}/g1a-validated-blobs.json
            ${{ runner.temp }}/g1a-diff-stat.txt
            ${{ runner.temp }}/g1a.log
          if-no-files-found: error
          retention-days: 2

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-131-g1a-prepublication-diagnostics
          path: |
            ${{ runner.temp }}/g1a.log
            ${{ runner.temp }}/g1a.patch
            ${{ runner.temp }}/g1a-compiler-corrections.patch
            ${{ runner.temp }}/g1a-procedural-test-corrections.patch
            ${{ runner.temp }}/g1a-draw-test-correction.patch
            ${{ runner.temp }}/g1a-editor-architecture-correction.patch
            ${{ runner.temp }}/g1a-editor-cfg-import-correction.patch
          if-no-files-found: warn
          retention-days: 2
