name: S2 Authority Cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Remove duplicate spatial authority and stale current-state docs
        shell: python
        run: |
          from pathlib import Path
          import shutil

          def remove_once(path, line):
              text = path.read_text()
              count = text.count(line)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one obsolete row, found {count}")
              path.write_text(text.replace(line, "", 1))

          remove_once(
              Path("docs-site/src/content/docs/workspace/crate-inventory.md"),
              "| `spatial` | `domain/spatial` | domain | Spatial coordinate contracts. | evolving |\n",
          )
          remove_once(
              Path("docs-site/src/content/docs/workspace/crate-docs-status.md"),
              "| `spatial` | `domain/spatial` | thin | [`../domain/spatial/README.md`](../domain/spatial/README.md) |\n",
          )

          for path in [
              Path("domain/spatial"),
              Path("docs-site/src/content/docs/domain/spatial"),
          ]:
              if not path.exists():
                  raise SystemExit(f"expected S2 deletion path missing before cleanup: {path}")
              shutil.rmtree(path)

      - name: Prove local spatial authority is gone
        shell: bash
        run: |
          set -euo pipefail
          test ! -e domain/spatial
          test ! -e docs-site/src/content/docs/domain/spatial
          ! grep -Fq '"domain/spatial"' Cargo.toml
          ! grep -Eq '^[[:space:]]*spatial[[:space:]]*=' Cargo.toml
          ! grep -Fq '| `spatial` | `domain/spatial` |' docs-site/src/content/docs/workspace/crate-inventory.md
          ! grep -Fq '| `spatial` | `domain/spatial` |' docs-site/src/content/docs/workspace/crate-docs-status.md

      - name: Commit authority cleanup
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spatial: delete duplicate foundation authority"
          git push origin "HEAD:${HEAD_BRANCH}"
