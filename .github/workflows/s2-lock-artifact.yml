name: S2 Finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply asserted build quantization separation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("engine/src/plugins/world/build/jobs.rs")
          text = path.read_text()
          text = replace_once(
              text,
              "    BuildGraphResource, BuildQueueResource, OperationLogResource, PartitionConfigResource,\n",
              "    BuildGraphResource, BuildQueueResource, OperationLogResource, PartitionConfigResource,\n    WorldQuantizationScaleResource,\n",
              "engine resource import",
          )
          text = replace_once(
              text,
              "    OperationLog, OperationRecord, touched_chunks_from_quantized_bounds,\n",
              "    OperationLog, OperationRecord, WorldQuantizationScale,\n    touched_chunks_from_quantized_bounds,\n",
              "world_ops scale import",
          )
          text = replace_once(
              text,
              "    partition: Res<PartitionConfigResource>,\n    op_log: Res<OperationLogResource>,\n",
              "    partition: Res<PartitionConfigResource>,\n    quantization_scale: Res<WorldQuantizationScaleResource>,\n    op_log: Res<OperationLogResource>,\n",
              "dispatch scale resource",
          )
          text = replace_once(
              text,
              "            &op_log,\n            partition.quantization_scale(),\n",
              "            &op_log,\n            **quantization_scale,\n",
              "build call scale",
          )
          if text.count("fixed_point_scale: i32") != 2:
              raise SystemExit("expected two build helper i32 scale parameters")
          text = text.replace(
              "fixed_point_scale: i32",
              "fixed_point_scale: WorldQuantizationScale",
          )
          text = replace_once(
              text,
              "        operations_affecting_chunk(op_log, partition, chunk_id, fixed_point_scale.max(1));\n",
              "        operations_affecting_chunk(op_log, partition, chunk_id, fixed_point_scale);\n",
              "validated build scale",
          )
          text = replace_once(
              text,
              "            )\n            .contains(&chunk_id)\n",
              "            )\n            .map(|chunks| chunks.contains(&chunk_id))\n            .unwrap_or(false)\n",
              "checked read-side spatial mapping",
          )
          path.write_text(text)

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Format workspace
        run: cargo +stable fmt --all

      - name: Commit finalizer output
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No finalizer changes remain"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spatial: format and finish build policy cutover"
          git push origin "HEAD:${HEAD_BRANCH}"
