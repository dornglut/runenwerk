name: S2 Migration Helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply asserted editor quantization separation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          lowering = Path("domain/editor/editor_scene/src/sdf_authoring/lowering.rs")
          text = lowering.read_text()
          text = replace_once(
              text,
              "    QuantizedAabb, QuantizedVec3, ReplayWindow, WorldRevision, quantize_aabb,\n",
              "    QuantizedAabb, QuantizedVec3, ReplayWindow, WorldQuantizationScale, WorldRevision,\n    quantize_aabb,\n",
              "world_ops import",
          )
          text = replace_once(
              text,
              "    SdfOperationIssueSeverity, SdfOperationLayerId, SdfOperationRatificationReport,\n    SdfPrimitiveKind, ratify_sdf_operation_document,\n",
              "    SdfOperationIssue, SdfOperationIssueCode, SdfOperationIssueSeverity,\n    SdfOperationIssueSubject, SdfOperationLayerId, SdfOperationRatificationReport, SdfPrimitiveKind,\n    ratify_sdf_operation_document,\n",
              "editor issue imports",
          )
          text = replace_once(
              text,
              "    pub partition: GridPartitionConfig,\n",
              "    pub partition: GridPartitionConfig,\n    pub quantization_scale: WorldQuantizationScale,\n",
              "lowering context field",
          )
          text = replace_once(
              text,
              "            partition: GridPartitionConfig::default(),\n",
              "            partition: GridPartitionConfig::default(),\n            quantization_scale: WorldQuantizationScale::default(),\n",
              "lowering context default",
          )
          text = replace_once(
              text,
              "impl SdfOperationLoweringContext {\n    pub fn fixed_point_scale(&self) -> i32 {\n        self.partition.quantization_scale()\n    }\n}\n",
              "impl SdfOperationLoweringContext {\n    pub const fn fixed_point_scale(&self) -> WorldQuantizationScale {\n        self.quantization_scale\n    }\n}\n",
              "lowering context scale accessor",
          )
          old_touch = """            touched_chunks.extend(touched_chunks_from_quantized_bounds(
                &context.partition,
                record.record.affected_bounds_q,
                context.planet_id,
                fixed_point_scale,
            ));
            records.push(record);
"""
          new_touch = """            match touched_chunks_from_quantized_bounds(
                &context.partition,
                record.record.affected_bounds_q,
                context.planet_id,
                fixed_point_scale,
            ) {
                Ok(chunks) => touched_chunks.extend(chunks),
                Err(error) => {
                    ratification.issues.push(SdfOperationIssue::error(
                        SdfOperationIssueCode::SpatialMappingError,
                        SdfOperationIssueSubject::Operation(record.source.operation_id.raw()),
                        format!("SDF operation bounds cannot map to spatial chunks: {error}"),
                    ));
                    continue;
                }
            }
            records.push(record);
"""
          text = replace_once(text, old_touch, new_touch, "checked touched-chunk mapping")
          type_count = text.count("fixed_point_scale: i32")
          if type_count < 1:
              raise SystemExit("expected lowering helper scale parameters")
          text = text.replace("fixed_point_scale: i32", "fixed_point_scale: WorldQuantizationScale")
          text = replace_once(
              text,
              "((value.max(0.001)) * fixed_point_scale.max(1) as f32)\n",
              "((value.max(0.001)) * fixed_point_scale.get() as f32)\n",
              "validated scale use",
          )
          lowering.write_text(text)

          ratification = Path("domain/editor/editor_scene/src/sdf_authoring/ratification.rs")
          text = ratification.read_text()
          text = replace_once(
              text,
              "    InvalidSmoothRadius,\n    GraphStructuralError,\n",
              "    InvalidSmoothRadius,\n    SpatialMappingError,\n    GraphStructuralError,\n",
              "spatial mapping issue code",
          )
          ratification.write_text(text)

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Format and refresh lockfile
        run: |
          cargo +stable fmt --all
          cargo +stable generate-lockfile

      - name: Commit editor policy separation
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No editor migration changes remain"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spatial: separate editor quantization policy"
          git push origin "HEAD:${HEAD_BRANCH}"
