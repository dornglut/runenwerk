name: RN8 N2 exact formatting

on:
  push:
    branches:
      - rn8-n2-engine-session-runennet-386

permissions:
  contents: write

jobs:
  format-n2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: rn8-n2-engine-session-runennet-386

      - name: Apply repository formatter to N2-touched files
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            engine/src/plugins/net/prediction.rs
            engine/src/plugins/net/runtime_io.rs
            engine/src/plugins/net/session_core.rs
            engine/src/plugins/net/streaming_state.rs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)

          if (( ${#changed[@]} == 0 )); then
            echo "N2 Rust sources are already formatted"
            exit 0
          fi

          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo "cargo fmt changed an unexpected path set" >&2
            printf 'changed: %s\n' "${changed[@]}" >&2
            exit 1
          fi

          git diff --check
          git diff -- "${expected[@]}"

      - name: Commit exact formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engine/src/plugins/net/prediction.rs \
            engine/src/plugins/net/runtime_io.rs \
            engine/src/plugins/net/session_core.rs \
            engine/src/plugins/net/streaming_state.rs
          git commit -m "RN8 N2: apply canonical formatting"
          git push origin HEAD:rn8-n2-engine-session-runennet-386
