name: G1A Transitive Caller Correction

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/g1a-transitive-caller-correction.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/pt-runengpu-g1a-transitive-callers' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact specification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/pt-runengpu-g1a-transitive-callers
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact transitive-caller correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "7ac6fe8cd1f404bd54a3c5bb93d72ac2e45664f5"

          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          blob = "01c992c61b3bebb6591913c1ccc07c6b41d28f4f"
          request = urllib.request.Request(
              f"https://api.github.com/repos/dornglut/runenwerk/git/blobs/{blob}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              patch = base64.b64decode(json.load(response)["content"])
          if len(patch) != 7259:
              raise SystemExit(f"unexpected patch length: {len(patch)}")
          actual = hashlib.sha256(patch).hexdigest()
          expected = "e68ffd0d9440fd0dd56c6a7828d1ad3c8b3c1ee55454b1bfb8ff6c3d21bcfc37"
          if actual != expected:
              raise SystemExit(f"patch mismatch: expected={expected} actual={actual}")
          Path(os.environ["RUNNER_TEMP"], "g1a-transitive.patch").write_bytes(patch)
          PY

          patch -p1 --batch < "$RUNNER_TEMP/g1a-transitive.patch"
          rm -f .github/workflows/g1a-transitive-caller-correction.yml
          test "$(git hash-object docs-site/src/content/docs/workspace/specs/pt-runengpu-g1a-logical-work-resource-identity.ron)" = "89552d1ce618b810dc0607a6a056556407bb3dfd"
          test "$(git diff --name-only origin/main | sort)" = "docs-site/src/content/docs/workspace/specs/pt-runengpu-g1a-logical-work-resource-identity.ron"
          git diff --check
          git add -A
          git commit -m "Add G1A transitive app-builder caller inventory"
          git push origin HEAD:docs/pt-runengpu-g1a-transitive-callers
