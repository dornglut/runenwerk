name: Issue 131 Recover Provisional Patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'impl/pt-runengpu-g1a-owner-scoped-resource-id'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recover previously reviewed provisional patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import bz2
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          blobs = [
              "7b9b40ced053a3a7d1c17c0c7fa5ed46ec1b08bc",
              "58e77e8042b1a6a311058afec76c18de1c3c642e",
              "abdf244c271353bb74ea13b67736d4874aad7765",
              "e711629943b6d3becd8f8829cc1769597a2fac5a",
              "11e7e4b58f04e325a6c3ecb7c3811687341aff51",
          ]

          chunks = []
          for blob in blobs:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/dornglut/runenwerk/git/blobs/{blob}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  chunks.append(base64.b64decode(json.load(response)["content"]))

          compressed = b"".join(chunks)
          expected = "b0d117c0ca955458907e6269afc869bdfb3b1d713ea6fbc7c43020c0a07d8bb8"
          actual = hashlib.sha256(compressed).hexdigest()
          if actual != expected:
              raise SystemExit(f"compressed patch mismatch: expected={expected} actual={actual}")

          patch = bz2.decompress(compressed).decode("utf-8")
          marker = "diff -ruN runenwerk-g1a-base/apps/"
          patch = patch[patch.index(marker):]
          out = Path(os.environ["RUNNER_TEMP"], "issue-131-provisional.patch")
          out.write_text(patch, encoding="utf-8")
          Path(os.environ["RUNNER_TEMP"], "sha256.txt").write_text(
              hashlib.sha256(patch.encode("utf-8")).hexdigest() + "  issue-131-provisional.patch\n",
              encoding="utf-8",
          )
          PY

      - name: Upload recovered patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-131-provisional-patch
          path: |
            ${{ runner.temp }}/issue-131-provisional.patch
            ${{ runner.temp }}/sha256.txt
          if-no-files-found: error
          retention-days: 1
