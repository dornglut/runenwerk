name: Issue 131 Apply G1A

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: issue-131-g1a-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'impl/pt-runengpu-g1a-owner-scoped-resource-id' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: impl/pt-runengpu-g1a-owner-scoped-resource-id
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Install maintained Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy

      - name: Run exact guarded implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import bz2
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          blob = "6b76c79f7f2b906039ea3eb86238ebd6cd3057cc"
          request = urllib.request.Request(
              f"https://api.github.com/repos/dornglut/runenwerk/git/blobs/{blob}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              compressed = base64.b64decode(json.load(response)["content"])
          if len(compressed) != 2787:
              raise SystemExit(f"unexpected runner length: {len(compressed)}")
          actual = hashlib.sha256(compressed).hexdigest()
          expected = "6f33c534cec89b9a561eb0660fcda71606edfef78cb675c8e93bdcc06a380594"
          if actual != expected:
              raise SystemExit(f"runner mismatch: expected={expected} actual={actual}")
          script = bz2.decompress(compressed)
          path = Path(os.environ["RUNNER_TEMP"], "g1a_runner.sh")
          path.write_bytes(script)
          path.chmod(0o700)
          PY
          "$RUNNER_TEMP/g1a_runner.sh"

      - name: Upload implementation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-131-g1a-diagnostics
          path: ${{ runner.temp }}/issue-131.log
          if-no-files-found: error
          retention-days: 3
