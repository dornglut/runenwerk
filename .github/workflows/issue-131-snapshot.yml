name: Issue 131 G1A Prepublication

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: issue-131-prepublication
  cancel-in-progress: true

jobs:
  validate-and-stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'impl/pt-runengpu-g1a-owner-scoped-resource-id'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout accepted implementation base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 88e9de3c94145c39391550efaf82a341630f081a
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Install maintained Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy

      - name: Fetch exact prepublication runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          blob = "41e619540572450d3cf61b3c808d120aa3645232"
          request = urllib.request.Request(
              f"https://api.github.com/repos/dornglut/runenwerk/git/blobs/{blob}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              runner = base64.b64decode(json.load(response)["content"])
          if len(runner) != 10_925:
              raise SystemExit(f"unexpected base runner length: {len(runner)}")
          actual = hashlib.sha256(runner).hexdigest()
          expected = "80645b2951066d0650fe24612b3771a9b04466848da0f74a174d22e90b79efc0"
          if actual != expected:
              raise SystemExit(f"base runner mismatch: expected={expected} actual={actual}")

          text = runner.decode("utf-8")
          list_marker = '''    (\n        "ce780b1ba050d147cee61b314d8b84730aa860c9",\n        1_437,\n        "881b81e70509c4715d4d64cfa57c82f00656bf5e17a802495748a9f969e400f0",\n        "g1a-procedural-test-corrections.patch",\n    ),\n]'''
          list_replacement = '''    (\n        "ce780b1ba050d147cee61b314d8b84730aa860c9",\n        1_437,\n        "881b81e70509c4715d4d64cfa57c82f00656bf5e17a802495748a9f969e400f0",\n        "g1a-procedural-test-corrections.patch",\n    ),\n    (\n        "671c59166087672796484dae804b7e7f0e8a41c3",\n        548,\n        "6e7bf52207a5427000ce7fe93e662787d8aebea19ed9a064663648eb94d52007",\n        "g1a-draw-test-correction.patch",\n    ),\n    (\n        "6d68ba0be6d720833316b61894dd67cf68ddc144",\n        2_859,\n        "832149b7e83b262fab4b5a750b2696f0adb1299859649941b838accf7c3efa2b",\n        "g1a-editor-architecture-correction.patch",\n    ),\n]'''
          if text.count(list_marker) != 1:
              raise SystemExit("runner correction-list marker mismatch")
          text = text.replace(list_marker, list_replacement, 1)

          apply_marker = 'patch -p1 --batch < "$RUNNER_TEMP/g1a-procedural-test-corrections.patch"\n'
          apply_replacement = (
              apply_marker
              + 'patch -p1 --batch < "$RUNNER_TEMP/g1a-draw-test-correction.patch"\n'
              + 'patch -p1 --batch < "$RUNNER_TEMP/g1a-editor-architecture-correction.patch"\n'
          )
          if text.count(apply_marker) != 1:
              raise SystemExit("runner patch-application marker mismatch")
          text = text.replace(apply_marker, apply_replacement, 1)

          runner = text.encode("utf-8")
          if len(runner) != 11_471:
              raise SystemExit(f"unexpected derived runner length: {len(runner)}")
          actual = hashlib.sha256(runner).hexdigest()
          expected = "8267ac81c7eeb947cded3909dab693fd847867bb75b27f50e7b945c6a12efd67"
          if actual != expected:
              raise SystemExit(f"derived runner mismatch: expected={expected} actual={actual}")

          path = Path(os.environ["RUNNER_TEMP"], "g1a-prepublication-runner.sh")
          path.write_bytes(runner)
          path.chmod(0o700)
          PY

      - name: Validate and stage unreferenced source blobs
        shell: bash
        run: "$RUNNER_TEMP/g1a-prepublication-runner.sh"

      - name: Upload validated blob manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-131-g1a-validated-blobs
          path: |
            ${{ runner.temp }}/g1a-validated-blobs.json
            ${{ runner.temp }}/g1a-diff-stat.txt
            ${{ runner.temp }}/g1a.log
          if-no-files-found: error
          retention-days: 2

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-131-g1a-prepublication-diagnostics
          path: |
            ${{ runner.temp }}/g1a.log
            ${{ runner.temp }}/g1a.patch
            ${{ runner.temp }}/g1a-compiler-corrections.patch
            ${{ runner.temp }}/g1a-procedural-test-corrections.patch
            ${{ runner.temp }}/g1a-draw-test-correction.patch
            ${{ runner.temp }}/g1a-editor-architecture-correction.patch
          if-no-files-found: warn
          retention-days: 2
