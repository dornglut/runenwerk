name: Issue 131 Apply G1A

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: issue-131-g1a-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'impl/pt-runengpu-g1a-owner-scoped-resource-id' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: impl/pt-runengpu-g1a-owner-scoped-resource-id
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Install maintained Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy

      - name: Reconstruct and apply exact implementation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/issue-131.log") 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "f171c5bad51fa476d1875b3b88807e202088f692"

          python - <<'PY'
          import base64
          import bz2
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          blobs = [
              "7b9b40ced053a3a7d1c17c0c7fa5ed46ec1b08bc",
              "58e77e8042b1a6a311058afec76c18de1c3c642e",
              "abdf244c271353bb74ea13b67736d4874aad7765",
              "e711629943b6d3becd8f8829cc1769597a2fac5a",
              "11e7e4b58f04e325a6c3ecb7c3811687341aff51",
          ]
          chunks = []
          for blob in blobs:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/dornglut/runenwerk/git/blobs/{blob}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  chunks.append(base64.b64decode(json.load(response)["content"]))

          compressed = b"".join(chunks)
          if len(compressed) != 17_549:
              raise SystemExit(f"unexpected compressed patch length: {len(compressed)}")
          actual = hashlib.sha256(compressed).hexdigest()
          expected = "b0d117c0ca955458907e6269afc869bdfb3b1d713ea6fbc7c43020c0a07d8bb8"
          if actual != expected:
              raise SystemExit(f"compressed patch mismatch: expected={expected} actual={actual}")

          patch = bz2.decompress(compressed).decode("utf-8")
          marker = "diff -ruN runenwerk-g1a-base/apps/"
          patch = patch[patch.index(marker):]
          Path(os.environ["RUNNER_TEMP"], "issue-131.patch").write_text(patch, encoding="utf-8")
          PY

          mkdir -p engine/src/plugins/gpu/api
          patch -p1 --batch < "$RUNNER_TEMP/issue-131.patch"
          rm -f .github/workflows/issue-131-snapshot.yml
          cargo +stable fmt --all
          git diff --check

          ! rg -n 'RenderResourceId|RenderResourceIdSequence' engine apps domain net adapters --glob '*.rs'
          ! rg -n 'GpuWorkResourceId::try_from_raw|TryFrom<u64> for GpuWorkResourceId|From<u64> for GpuWorkResourceId' engine apps --glob '*.rs'
          test -f engine/src/plugins/gpu/api/work_resource_id.rs
          test ! -e .github/workflows/issue-131-snapshot.yml

          python - <<'PY'
          import subprocess
          allowed_exact = {
              "apps/runenwerk_editor/src/runtime/viewport/render_jobs.rs",
              "engine/src/plugins/mod.rs",
              "engine/src/plugins/render/api/bindings.rs",
              "engine/src/plugins/render/api/flow.rs",
              "engine/src/plugins/render/api/handles.rs",
              "engine/src/plugins/render/api/ids.rs",
              "engine/src/plugins/render/api/passes.rs",
              "engine/src/plugins/render/backend/resource_allocator.rs",
              "engine/src/plugins/render/frame/packet.rs",
              "engine/src/plugins/render/gpu_primitives/compaction.rs",
              "engine/src/plugins/render/gpu_primitives/counters.rs",
              "engine/src/plugins/render/gpu_primitives/draw_args.rs",
              "engine/src/plugins/render/gpu_primitives/plan.rs",
              "engine/src/plugins/render/gpu_primitives/scan.rs",
              "engine/src/plugins/render/graph/capabilities.rs",
              "engine/src/plugins/render/graph/diagnostics.rs",
              "engine/src/plugins/render/graph/execution_plan.rs",
              "engine/src/plugins/render/graph/pass_graph.rs",
              "engine/src/plugins/render/graph/planning.rs",
              "engine/src/plugins/render/graph/prepared_validation.rs",
              "engine/src/plugins/render/graph/resource_graph.rs",
              "engine/src/plugins/render/graph/resource_lifetimes.rs",
              "engine/src/plugins/render/graph/validation.rs",
              "engine/src/plugins/render/procedural/authoring.rs",
              "engine/src/plugins/render/procedural/descriptors.rs",
              "engine/src/plugins/render/procedural/population/uniform_grid.rs",
              "engine/src/plugins/render/renderer/render_flow/execute_passes.rs",
              "engine/src/plugins/render/renderer/render_flow/runtime_resources.rs",
              "engine/src/plugins/render/renderer/render_flow/runtime_resources/realize.rs",
              "engine/src/plugins/render/renderer/render_flow/runtime_resources/resolve.rs",
              "engine/src/plugins/render/resource/descriptors.rs",
              "engine/src/plugins/render/resource/import.rs",
              "engine/src/plugins/render/resource/transient.rs",
              "engine/src/plugins/render/resource/usages.rs",
              "engine/src/plugins/render/runtime/frame_prepare.rs",
              "engine/tests/render_dynamic_targets.rs",
              "engine/tests/render_import_contract.rs",
              "engine/tests/render_resource_model.rs",
              "engine/tests/render_runtime_inspect.rs",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines())
          unexpected = sorted(
              path for path in changed
              if path not in allowed_exact and not path.startswith("engine/src/plugins/gpu/")
          )
          if unexpected:
              raise SystemExit(f"unexpected G1A paths: {unexpected}")
          PY

      - name: Run focused G1A proofs
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/issue-131.log") 2>&1
          cargo test -p engine gpu_work_resource_id --locked
          cargo test -p engine foreign_uniform_handle --locked
          cargo test -p engine foreign_storage_handle --locked
          cargo test -p engine render_resource --locked

      - name: Run engine validation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/issue-131.log") 2>&1
          cargo test -p engine --lib --locked
          cargo test -p engine --tests --locked
          cargo clippy -p engine --all-targets --locked -- -D warnings

      - name: Run canonical repository validation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/issue-131.log") 2>&1
          cargo +stable validate
          git diff --check

      - name: Commit and publish G1A
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/issue-131.log") 2>&1
          git add -A
          git status --short
          git commit -m "Implement owner-scoped GPU work-resource identity"
          git push origin HEAD:impl/pt-runengpu-g1a-owner-scoped-resource-id

      - name: Upload implementation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-131-g1a-diagnostics
          path: ${{ runner.temp }}/issue-131.log
          if-no-files-found: error
          retention-days: 3
