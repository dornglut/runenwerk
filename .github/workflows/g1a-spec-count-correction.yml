name: G1A Specification Count Correction

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/g1a-spec-count-correction.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/pt-runengpu-g1a-fallible-authoring-correction' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact specification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/pt-runengpu-g1a-fallible-authoring-correction
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact inventory wording correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          blob = "c56e0fdf7c096e53c8427e728c23afb287cd7543"
          request = urllib.request.Request(
              f"https://api.github.com/repos/dornglut/runenwerk/git/blobs/{blob}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              patch = base64.b64decode(json.load(response)["content"])
          if len(patch) != 1578:
              raise SystemExit(f"unexpected patch length: {len(patch)}")
          actual = hashlib.sha256(patch).hexdigest()
          expected = "2e9504fad11ae54bd47d0f9a2b3b9cc563443782e13e287b987b0b43ae777248"
          if actual != expected:
              raise SystemExit(f"patch mismatch: expected={expected} actual={actual}")
          Path(os.environ["RUNNER_TEMP"], "g1a-count.patch").write_bytes(patch)
          PY
          patch -p1 --batch < "$RUNNER_TEMP/g1a-count.patch"
          rm -f .github/workflows/g1a-spec-count-correction.yml
          test "$(git hash-object docs-site/src/content/docs/workspace/specs/pt-runengpu-g1a-logical-work-resource-identity.ron)" = "8159b9ac85f1770c0bd21728f8f9403351708d87"
          test "$(git diff --name-only origin/main | sort)" = "docs-site/src/content/docs/workspace/specs/pt-runengpu-g1a-logical-work-resource-identity.ron"
          git diff --check
          git add -A
          git commit -m "Clarify G1A fallible authoring inventory"
          git push origin HEAD:docs/pt-runengpu-g1a-fallible-authoring-correction
