name: Issue 133 Apply SDF Retirement

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: issue-133-retirement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'impl/pt-runensdf-004-retire-internal-sdf' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: impl/pt-runensdf-004-retire-internal-sdf
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Install maintained Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy

      - name: Apply exact retirement target
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/issue-133.log") 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          url = "https://api.github.com/repos/dornglut/runenwerk/git/blobs/d21faf3b10ea8ee45c27b2950c8228cac60a0459"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              encoded = json.load(response)["content"]
          malformed = base64.b64decode(encoded)
          if len(malformed) != 16_320:
              raise SystemExit(f"unexpected patch blob length: {len(malformed)}")
          patch_gzip = malformed[:8250] + bytes.fromhex("ae173d") + malformed[8250:]
          header = f"blob {len(patch_gzip)}\0".encode()
          actual = hashlib.sha1(header + patch_gzip).hexdigest()
          expected = "300442bb3b3f54ab4bf0e38830ab9fe9bb710bed"
          if actual != expected:
              raise SystemExit(f"patch blob mismatch: expected={expected} actual={actual}")
          Path(os.environ["RUNNER_TEMP"], "issue-133.patch.gz").write_bytes(patch_gzip)
          PY

          gzip --decompress --stdout "$RUNNER_TEMP/issue-133.patch.gz" > "$RUNNER_TEMP/issue-133.patch"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/issue-133.patch"
          rm -rf domain/sdf docs-site/src/content/docs/domain/sdf
          rm -f .github/workflows/issue-133-census.yml

          python - <<'PY'
          from pathlib import Path
          path = Path("Cargo.lock")
          text = path.read_text(encoding="utf-8")
          retired = "\n".join([
              '[[package]]',
              'name = "sdf"',
              'version = "0.1.0"',
              'dependencies = [',
              ' "glam 0.31.1",',
              ' "thiserror 2.0.18",',
              ']',
              '',
              '',
          ])
          if text.count(retired) != 1:
              raise SystemExit("expected exactly one internal sdf lockfile package")
          path.write_text(text.replace(retired, "", 1), encoding="utf-8")
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path("tools/xtask/src/main.rs")
          text = path.read_text(encoding="utf-8")
          usage_index = text.index("fn print_usage()")
          usage = text[usage_index:].rstrip() + "\n\n"
          without_usage = text[:usage_index].rstrip() + "\n"
          test_index = without_usage.index("#[cfg(test)]")
          path.write_text(
              without_usage[:test_index] + usage + without_usage[test_index:],
              encoding="utf-8",
          )
          PY
          git status --short

      - name: Verify exact retirement target
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/issue-133.log") 2>&1
          test ! -e domain/sdf
          test ! -e docs-site/src/content/docs/domain/sdf
          test ! -e .github/workflows/issue-133-census.yml
          ! grep -F '"domain/sdf"' Cargo.toml
          ! grep -F 'name = "sdf"' Cargo.lock
          grep -F 'reusable-rust-cargo-validate.yml@b6caad377102ca73794efaf734a65903b8efa829' .github/workflows/ci.yml

          cat > "$RUNNER_TEMP/expected-blobs.txt" <<'EXPECTED_BLOBS'
          c267397ca19f0a553dfa21c067cb19daf79786c5  Cargo.lock
          459499fa6db402bd246d43504236d61a049e54ab  Cargo.toml
          91b24a5d393d1d2c3b9ec046e8558a19b700549c  docs-site/src/content/docs/apps/runenwerk-editor/README.md
          8ccc9f2563277139d4459d9baeb050bfc77bfa14  docs-site/src/content/docs/apps/runenwerk-editor/roadmap.md
          0e4faa3833472ca27ea0d35de74c2cdaa81dca0f  docs-site/src/content/docs/architecture/repository-family-architecture.md
          9a65cf54978861440644da099ee0411166a19a86  docs-site/src/content/docs/design/accepted/sdf-first-field-world-platform-design.md
          ed9d9f6c99bf6862e915bf4d4e55d0578973d5bc  docs-site/src/content/docs/design/active/editor-asset-pipeline-and-content-workflow-design.md
          034019d70130ed19386d172343d0bc9645caf290  docs-site/src/content/docs/design/active/editor-procedural-content-and-simulation-workflow-plan.md
          e2079d6a50ff8e18f353f572b9dd5c8b4b4b1625  docs-site/src/content/docs/design/active/gameplay-graph-atr-ir-and-ecs-lowering-design.md
          cbdce7412fe9c5e9c2a03e5ecea3a21a80f3a5ee  docs-site/src/content/docs/design/active/runensdf-extraction-design.md
          69b2a8ecac66ccef1cfc21661e0109528e92145b  docs-site/src/content/docs/design/active/runensdf-repository-identity-decision.md
          8f17e391e4b95fcf30bdb366b49513b4aeb5d1a5  docs-site/src/content/docs/design/active/sdf-procedural-animation-and-animated-models-design.md
          18b3f43f2e0fc54775f9c5ca3a265616a20fb741  docs-site/src/content/docs/domain/00-overview.md
          b4997b2f437399d7daf97113c79555f4abc45ea3  docs-site/src/content/docs/engine/plugins/render/docs/roadmap.md
          8c8662c9ed78a60a85293317941ff78b30ec46bd  docs-site/src/content/docs/guidelines/domain-map.md
          e63bba9d482b4666f87e883d283d8006f0d8a980  docs-site/src/content/docs/reports/closeouts/p1-sdf-modeling-core/closeout.md
          be08d4246b5e5bb1a9d41b205cc406afea187cf5  docs-site/src/content/docs/reports/closeouts/p1-sdf-operation-layer/closeout.md
          44623754ab030c9891b38d1d670431f47506c5da  docs-site/src/content/docs/reports/closeouts/pt-runensdf-004-internal-sdf-retirement-closeout.md
          fc0cdc595e6181761c0622569528d91494c33a2e  docs-site/src/content/docs/reports/investigations/repository-family-current-state-investigation.md
          65b4ebaf6fae040a5b2f2040cd375cfdb2ed66bf  docs-site/src/content/docs/reports/investigations/runensdf-extraction-investigation.md
          254b5cbc219650fdb04b65a07db571702783ab0b  docs-site/src/content/docs/workspace/crate-docs-status.md
          f71aabda34e39115b7a50d16b1778a0afe99af9d  docs-site/src/content/docs/workspace/crate-inventory.md
          494ed815eb6199b2c9009162f6b2c1e611f617c1  docs-site/src/content/docs/workspace/planning/active-work.md
          47d61e7a55675058efaa320de368fc93929e491b  docs-site/src/content/docs/workspace/planning/completed-work.md
          72d726e47282a291aff329e6fc3eac4da216aace  docs-site/src/content/docs/workspace/planning/roadmap.md
          d2e1c558547168cb09fa726350b04b55a2524cd9  docs-site/src/content/docs/workspace/repo-execution-priority-checklist.md
          f13289d515d61b47b822422aba70e90a9cbcfd8d  tools/xtask/src/main.rs
          EXPECTED_BLOBS
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "blob mismatch: $path expected=$expected actual=$actual"; exit 1; }
          done < "$RUNNER_TEMP/expected-blobs.txt"

      - name: Run canonical repository validation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/issue-133.log") 2>&1
          cargo +stable fmt --all --check
          cargo metadata --format-version 1 --locked --no-deps > "$RUNNER_TEMP/metadata.json"
          cargo +stable validate
          git diff --check

      - name: Commit and publish retirement
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/issue-133.log") 2>&1
          git add -A
          git status --short
          git commit -m "Retire duplicate internal SDF authority"
          git push origin HEAD:impl/pt-runensdf-004-retire-internal-sdf

      - name: Upload application diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-133-application-diagnostics
          path: ${{ runner.temp }}/issue-133.log
          if-no-files-found: error
          retention-days: 3
