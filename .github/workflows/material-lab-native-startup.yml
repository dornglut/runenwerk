name: Material Lab native startup proof

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/material-lab-native-startup.yml"
      - "apps/runenwerk_editor/src/**"
      - "apps/runenwerk_editor/Cargo.toml"
      - "engine/src/plugins/render/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: material-lab-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  material-lab-native:
    name: Material Lab / real X11 Vulkan startup
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the exact feature revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify exact head SHA
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"

      - name: Install stable Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal

      - name: Install native X11 and software Vulkan runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools xvfb xauth libxkbcommon-x11-0
          icd="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "Lavapipe ICD: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=${RUNNER_TEMP}/runenrender-vulkan-xdg" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/runenrender-vulkan-xdg"
          chmod 700 "${RUNNER_TEMP}/runenrender-vulkan-xdg"

      - name: Prove Vulkan software adapter
        run: vulkaninfo --summary

      - name: Build the actual Material Lab binary
        run: |
          set -euo pipefail
          cargo +stable build --locked -p runenwerk_editor --bin runenwerk_material_lab

      - name: Execute Material Lab through a real X11 window
        env:
          RUST_BACKTRACE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=3s 20s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            ./target/debug/runenwerk_material_lab > material-native-startup.log 2>&1
          status=$?
          set -e
          cat material-native-startup.log
          if grep -E -i 'thread .* panicked|runtime frame failed|ReadBeforeInitialization|render backend execution failed' material-native-startup.log; then
            echo "Native Material Lab reported a fatal frame error" >&2
            exit 1
          fi
          if test "$status" -ne 124; then
            echo "Native Material Lab exited before the bounded 20-second observation (exit=$status)" >&2
            exit 1
          fi
          echo "Native Material Lab remained alive through the 20-second X11/Vulkan startup interval"

      - name: Upload native startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: material-lab-native-startup
          path: material-native-startup.log
          if-no-files-found: warn
